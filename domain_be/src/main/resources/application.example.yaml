# application.yaml 예시. 이 파일을 application.yaml로 복사한 뒤 비밀번호를 채우세요 (application.yaml은 git에 올리지 않음)
spring:
  application:
    name: demo

  datasource:
    url: jdbc:mariadb://localhost:3306/yyuna03?characterEncoding=UTF-8&useUnicode=true
    driver-class-name: org.mariadb.jdbc.Driver
    username: yyuna03
    password: "CHANGE_ME" # 실제 DB 비밀번호로 바꾸세요

  servlet:
    multipart: # 자료실 업로드 용량 제한
      max-file-size: 10MB
      max-request-size: 11MB

  mail: # 찾기·로그인 인증·방명록 알림 메일 (네이버 SMTP). 계정과 비밀번호는 아래 secret.yaml에 둔다
    host: smtp.naver.com
    port: 465
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  config: # 저장소에 올리지 않는 값 (서버: /home/hosting_users/yyuna03/secret.yaml)
    import: optional:file:${user.home}/secret.yaml

mybatis: # spring과 같은 최상위 레벨
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true # created_at → createdAt

server:
  error:
    include-message: always # 에러 응답에 메시지 포함 (프론트에서 표시)

app:
  mail:
    from: fromdajung@naver.com  # 보내는 주소 (네이버는 SMTP 로그인 계정과 같아야 함)
    admin: fromdajung@naver.com # 방명록 새 글 알림을 받을 관리자 주소
  cors:
    allowed-origins: http://localhost:3000 # Nuxt 개발 서버
